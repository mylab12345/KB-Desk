[workspace]
resolver = "2"
members = [
    "crates/kbdesk-core",
    "crates/kbdesk-server",
    "crates/kbdesk-host",
    "crates/kbdesk-client",
    "crates/kbdesk-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["KB-Desk contributors"]
repository = ""

[workspace.dependencies]
kbdesk-core = { path = "crates/kbdesk-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
