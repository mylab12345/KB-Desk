[workspace]
resolver = "2"
members = [
    "crates/kbdesk-core",
    "crates/kbdesk-server",
    "crates/kbdesk-host",
    "crates/kbdesk-client",
    "crates/kbdesk-web",
    "crates/kbdesk-launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["KB-Desk contributors"]
repository = ""

[workspace.dependencies]
kbdesk-core = { path = "crates/kbdesk-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# --- encryption (TLS transport + viewer<->host end-to-end session crypto) ---
# ring only: avoid the aws-lc-rs provider (cmake/nasm build weight, and a
# second process-wide crypto provider). Every binary installs the ring
# provider explicitly via kbdesk_core::tls::ensure_crypto_provider().
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
rcgen = "0.14"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
