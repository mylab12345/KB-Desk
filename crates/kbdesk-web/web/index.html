<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KB-Desk — Web Viewer</title>
<style>
  :root { --bg:#0e1116; --panel:#171c24; --line:#28303c; --fg:#e7edf3; --mut:#8b98a8; --acc:#4f9cf9; --ok:#3ecf8e; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
              font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:10px 14px; flex:none; }
  h1 { font-size:15px; margin:0 0 8px; font-weight:600; letter-spacing:.2px; }
  h1 span { color:var(--mut); font-weight:400; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  label { color:var(--mut); font-size:12px; }
  input { background:#0b0e13; border:1px solid var(--line); color:var(--fg);
          border-radius:7px; padding:6px 9px; font-size:13px; outline:none; }
  input:focus { border-color:var(--acc); }
  button { background:var(--acc); color:#04121f; border:0; border-radius:7px;
           padding:7px 14px; font-weight:600; cursor:pointer; font-size:13px; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  button:disabled { opacity:.45; cursor:default; }
  #status { margin-top:8px; font-size:12.5px; color:var(--mut); min-height:18px; }
  #status.ok { color:var(--ok); } #status.err { color:var(--err); }
  #stage { position:relative; flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#05070a; }
  canvas { max-width:100%; max-height:100%; display:block; background:#000; cursor:default; outline:none; }
  canvas:focus { box-shadow:0 0 0 2px var(--acc) inset; }
  #hint { position:absolute; color:var(--mut); text-align:center; padding:0 24px; pointer-events:none; max-width:560px; }
  /* when connected: hide the form, show live controls */
  body.live #form { display:none; }
  body.live #title { display:none; }
  #live { display:none; }
  body.live #live { display:flex; }
  #live .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); display:inline-block; margin-right:6px; }
  .live-status { color:var(--ok); font-size:12.5px; margin-right:auto; display:flex; align-items:center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">KB-Desk <span>· web viewer</span></h1>

    <div class="row" id="form">
      <label for="id">ID</label>
      <input id="id" size="12" placeholder="123 456 789" />
      <label for="pw">Password</label>
      <input id="pw" type="password" size="16" />
      <span id="addrWrap" style="display:none">
        <label for="addr">Host address</label>
        <input id="addr" size="20" placeholder="host:21118" />
      </span>
      <button id="connect">Connect</button>
    </div>

    <div class="row" id="live">
      <span class="live-status"><span class="dot"></span><span id="liveText">Connected</span></span>
      <button id="fullscreen" class="ghost">Fullscreen</button>
      <button id="disconnect" class="ghost">Disconnect</button>
    </div>

    <div id="status">Not connected. Enter the ID and password, then press Connect.</div>
  </header>
  <div id="stage">
    <canvas id="screen" width="1280" height="720" tabindex="0"></canvas>
    <div id="hint">Enter an ID and password, then press Connect.<br />
      <span style="font-size:12px">Click the screen once to send keyboard input to the remote machine.</span></div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const canvas = $("screen");
  const ctx = canvas.getContext("2d");
  const statusEl = $("status");
  const hint = $("hint");
  const liveText = $("liveText");

  let ws = null;
  let connected = false;
  let frameW = 1, frameH = 1;
  let relayConfigured = false;

  const setStatus = (msg, cls = "") => { statusEl.textContent = msg; statusEl.className = cls; };
  const send = (obj) => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); };

  fetch("/config").then(r => r.json()).then(cfg => {
    relayConfigured = !!cfg.relay;
    if (!relayConfigured) $("addrWrap").style.display = "inline";
  }).catch(() => { $("addrWrap").style.display = "inline"; });

  function connect() {
    const password = $("pw").value;
    const id = $("id").value.trim();
    const address = $("addr").value.trim();
    if (!password) { setStatus("Enter the password.", "err"); return; }
    if (!relayConfigured && !address) { setStatus("Enter the host address.", "err"); return; }

    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(proto + location.host + "/ws");
    ws.binaryType = "arraybuffer";
    ws.onopen = () => {
      connected = true;
      hint.style.display = "none";
      document.body.classList.add("live");
      setStatus("Connecting…");
      send({ type: "connect", id: id || null, address: address || null, password });
      canvas.focus();
    };
    ws.onmessage = (ev) => {
      if (typeof ev.data === "string") {
        const m = JSON.parse(ev.data);
        if (m.type === "status") { setStatus(m.message, "ok"); liveText.textContent = m.message; }
        else if (m.type === "error") setStatus(m.message, "err");
      } else {
        drawFrame(new Uint8Array(ev.data));
      }
    };
    ws.onclose = () => resetView("Disconnected.");
    ws.onerror = () => setStatus("WebSocket connection error.", "err");
  }

  function disconnect() { if (ws) ws.close(); }

  function resetView(msg) {
    connected = false; ws = null;
    document.body.classList.remove("live");
    hint.style.display = "block";
    setStatus(msg);
  }

  async function drawFrame(bytes) {
    if (bytes.length < 5) return;
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const w = dv.getUint16(0), h = dv.getUint16(2);
    frameW = w; frameH = h;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const blob = new Blob([bytes.subarray(5)], { type: "image/jpeg" });
    try {
      const bitmap = await createImageBitmap(blob);
      ctx.drawImage(bitmap, 0, 0);
      if (bitmap.close) bitmap.close();
    } catch (e) { /* skip a corrupt frame */ }
  }

  // ---- mouse ----
  function toRemote(ev) {
    const r = canvas.getBoundingClientRect();
    const x = Math.round((ev.clientX - r.left) / r.width * frameW);
    const y = Math.round((ev.clientY - r.top) / r.height * frameH);
    return { x: Math.max(0, Math.min(frameW - 1, x)), y: Math.max(0, Math.min(frameH - 1, y)) };
  }
  const BUTTON = { 0: "Left", 1: "Middle", 2: "Right" };

  canvas.addEventListener("mousedown", (e) => {
    canvas.focus();
    if (!connected) return;
    e.preventDefault();
    const { x, y } = toRemote(e);
    send({ type: "input", event: { MouseMove: { x, y } } });
    send({ type: "input", event: { MouseButton: { button: BUTTON[e.button] || "Left", down: true } } });
  });
  canvas.addEventListener("mousemove", (e) => {
    if (!connected) return;
    const { x, y } = toRemote(e);
    send({ type: "input", event: { MouseMove: { x, y } } });
  });
  window.addEventListener("mouseup", (e) => {
    if (!connected) return;
    if (BUTTON[e.button]) send({ type: "input", event: { MouseButton: { button: BUTTON[e.button], down: false } } });
  });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("wheel", (e) => {
    if (!connected) return;
    e.preventDefault();
    send({ type: "input", event: { MouseScroll: { dx: Math.round(e.deltaX / 10), dy: Math.round(e.deltaY / 10) } } });
  }, { passive: false });

  // ---- keyboard ----
  // Named (non-printing) keys. Printable characters go through Event-less mapping
  // using e.key, which already includes the effect of Shift and the layout.
  const NAMED = {
    Enter: "Enter", Tab: "Tab", Escape: "Escape", Backspace: "Backspace", Delete: "Delete",
    Home: "Home", End: "End", PageUp: "PageUp", PageDown: "PageDown",
    ArrowUp: "ArrowUp", ArrowDown: "ArrowDown", ArrowLeft: "ArrowLeft", ArrowRight: "ArrowRight",
    CapsLock: "CapsLock",
    F1: "F1", F2: "F2", F3: "F3", F4: "F4", F5: "F5", F6: "F6", F7: "F7", F8: "F8",
    F9: "F9", F10: "F10", F11: "F11", F12: "F12",
  };
  // Modifiers we hold down for the duration of the press (so Ctrl+C etc. work).
  const HELD = { Control: "ControlLeft", Alt: "Alt", Meta: "Meta" };

  const sendKey = (key, down) => send({ type: "input", event: { Key: { key, down } } });

  window.addEventListener("keydown", (e) => {
    if (!connected) return;
    if (e.key === "Shift") { e.preventDefault(); return; } // handled contextually below
    if (HELD[e.key]) {
      e.preventDefault();
      if (!e.repeat) sendKey({ Named: HELD[e.key] }, true);
      return;
    }
    if (e.key.length === 1) {                // printable: e.key already has Shift applied
      e.preventDefault();
      sendKey({ Char: e.key }, true);
      sendKey({ Char: e.key }, false);
      return;
    }
    if (NAMED[e.key]) {
      e.preventDefault();
      if (e.repeat) return;
      // Wrap named keys with Shift so selections (Shift+Arrow, Shift+Tab) work.
      if (e.shiftKey) sendKey({ Named: "ShiftLeft" }, true);
      sendKey({ Named: NAMED[e.key] }, true);
      if (e.shiftKey) sendKey({ Named: "ShiftLeft" }, false);
    }
  });

  window.addEventListener("keyup", (e) => {
    if (!connected) return;
    if (e.key === "Shift") { e.preventDefault(); return; }
    if (HELD[e.key]) { e.preventDefault(); sendKey({ Named: HELD[e.key] }, false); return; }
    if (e.key.length === 1) return;          // already released
    if (NAMED[e.key]) sendKey({ Named: NAMED[e.key] }, false);
  });

  $("connect").addEventListener("click", connect);
  $("disconnect").addEventListener("click", disconnect);
  $("fullscreen").addEventListener("click", () => {
    const stage = $("stage");
    if (!document.fullscreenElement) stage.requestFullscreen?.(); else document.exitFullscreen?.();
  });
})();
</script>
</body>
</html>
