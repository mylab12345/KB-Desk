name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# TEMPORARY (dev from a sandbox that cannot reach the Actions log host):
# lets the failure steps below post their own log as an issue. Removed
# together with those steps once this work is green.
permissions:
  contents: read
  issues: write

jobs:
  build:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # enigo's Linux backend links libxcb; the runner image hasn't got it.
      - name: Install system libraries (enigo/xcb)
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libxcb1-dev libxcb-render0-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libxkbcommon-dev

      # NOTE: `set -o pipefail` is essential — without it a failing cargo
      # command piped into tee would report success.
      - name: Check whole workspace compiles
        run: set -o pipefail; cargo check --workspace --locked 2>&1 | tee -a ci.log

      - name: Test (protocol, relay, web bridge, host, launcher)
        run: >-
          set -o pipefail; cargo test --locked
          -p kbdesk-core -p kbdesk-server -p kbdesk-web
          -p kbdesk-host -p kbdesk-launcher 2>&1 | tee -a ci.log

      - name: Browser crypto tests (pure-JS E2E implementation)
        run: node tests/js/crypto.test.cjs 2>&1 | tee -a ci.log

      - name: Release build of the browser-control stack
        run: >-
          set -o pipefail; cargo build --release --locked
          -p kbdesk-launcher -p kbdesk-server -p kbdesk-web -p kbdesk-host -p kbdesk-client
          2>&1 | tee -a ci.log

      # End-to-end smoke test of the exact "control from a browser" path,
      # now with mandatory encryption on every leg:
      #   browser_client.py --WSS--> kbdesk-web (blind bridge)
      #     --TLS--> tap_proxy.py (captures wire bytes) --> relay --TLS-->
      #     fake_host.py, with the protocol-v2 end-to-end encrypted session
      #     (X25519 + password key confirmation) between the two Pythons.
      # Asserts: spaced ID works, unknown ID fails, wrong password is caught
      # by key confirmation, encrypted JPEG frames + mouse/key/text input,
      # stream retune, ping/pong, clean session end — and that the tapped
      # wire carries ONLY TLS ciphertext (no password/text/JPEG/plaintext).
      - name: E2E smoke test (browser via relay, TLS + E2E encrypted)
        run: |
          exec > >(tee -a ci.log) 2>&1
          set -x
          ./target/release/kbdesk --help | grep -q serve
          test -x ./target/release/kbdesk-server && test -x ./target/release/kbdesk-web
          pip install --quiet websockets cryptography
          # Throwaway test CA + leaf for 127.0.0.1/localhost.
          mkdir -p /tmp/kbtls
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/kbtls/ca-key.pem -out /tmp/kbtls/ca.pem -days 2 -nodes -subj "/CN=KB-Desk test CA" 2>/dev/null
          openssl req -newkey rsa:2048 -keyout /tmp/kbtls/key.pem -out /tmp/kbtls/leaf.csr -nodes -subj "/CN=localhost" 2>/dev/null
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > /tmp/kbtls/ext.cnf
          openssl x509 -req -in /tmp/kbtls/leaf.csr -CA /tmp/kbtls/ca.pem -CAkey /tmp/kbtls/ca-key.pem -CAcreateserial -out /tmp/kbtls/cert.pem -days 2 -extfile /tmp/kbtls/ext.cnf 2>/dev/null
          ./target/release/kbdesk-server --bind 127.0.0.1 --port 21118 --tls-cert /tmp/kbtls/cert.pem --tls-key /tmp/kbtls/key.pem &
          python3 tests/e2e/tap_proxy.py &
          ./target/release/kbdesk-web --listen 127.0.0.1:8080 --relay 127.0.0.1:21119 --tls-cert /tmp/kbtls/cert.pem --tls-key /tmp/kbtls/key.pem --tls-ca /tmp/kbtls/ca.pem &
          python3 tests/e2e/fake_host.py &
          for i in $(seq 1 30); do curl -skf https://127.0.0.1:8080/healthz && break || sleep 1; done
          curl -skf https://127.0.0.1:8080/config | grep -q '"relay":true'
          curl -skf https://127.0.0.1:8080/config | grep -q '"e2e":true'
          curl -skf https://127.0.0.1:8080/ | grep -q 'crypto.js'
          curl -skf https://127.0.0.1:8080/crypto.js | grep -q 'KBCrypto'
          python3 tests/e2e/browser_client.py
          python3 tests/e2e/check_tap.py
          grep -q '"auth", true' /tmp/fake_host_log.jsonl
          grep -q 'MouseMove' /tmp/fake_host_log.jsonl
          grep -q 'hello remote' /tmp/fake_host_log.jsonl
          grep -q 'ReleaseAll' /tmp/fake_host_log.jsonl
          grep -q '"quality": 50' /tmp/fake_host_log.jsonl
          echo E2E-OK

      # TEMPORARY: see the permissions note at the top of this file.
      - name: Post failure log as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "CI failure log tail for ${GITHUB_SHA}:"; echo '```'; tail -n 300 ci.log 2>/dev/null; echo '```'; } > /tmp/body.md
          gh issue create --title "ci-log ${GITHUB_SHA::8}" --body-file /tmp/body.md || true

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: kbdesk-linux-x86_64
          path: |
            target/release/kbdesk
            target/release/kbdesk-server
            target/release/kbdesk-web
            target/release/kbdesk-host
            target/release/kbdesk-client
          if-no-files-found: error

  cross-check:
    name: cargo check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-gnu, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      # ring (rustls' crypto provider) compiles C + asm, so the darwin
      # cross-check needs a C compiler that can target macOS from Linux:
      # zig cc provides one without an Apple SDK (check-only; no linking).
      - if: matrix.target == 'x86_64-apple-darwin'
        name: C toolchain for ring (zig cc)
        run: |
          pip install --quiet ziglang
          # cc-rs adds its own --target=x86_64-apple-macosx (and Apple-clang
          # flags like -arch/-gfull) that zig rejects; filter them out.
          cat > /tmp/zigcc-darwin <<'EOF'
          #!/bin/bash
          args=()
          skip_next=0
          for a in "$@"; do
            if [ "$skip_next" = 1 ]; then skip_next=0; continue; fi
            case "$a" in
              --target=*) ;;
              -arch) skip_next=1 ;;
              -gfull) args+=("-g") ;;
              *) args+=("$a") ;;
            esac
          done
          exec python3 -m ziglang cc -target x86_64-macos-gnu "${args[@]}"
          EOF
          printf '#!/bin/sh\nexec python3 -m ziglang ar "$@"\n' > /tmp/zigar-darwin
          chmod +x /tmp/zigcc-darwin /tmp/zigar-darwin
          echo "CC_x86_64_apple_darwin=/tmp/zigcc-darwin" >> "$GITHUB_ENV"
          echo "AR_x86_64_apple_darwin=/tmp/zigar-darwin" >> "$GITHUB_ENV"
      # egui/eframe cross-compilation needs target GUI SDKs; the README only
      # claims check-level support, and the headless crates are the ones whose
      # cross-platform code (capture/input backends) actually matters here.
      - run: >-
          set -o pipefail; cargo check --locked --target ${{ matrix.target }}
          -p kbdesk-core -p kbdesk-server -p kbdesk-web
          -p kbdesk-host -p kbdesk-launcher 2>&1 | tee -a ci.log
      # TEMPORARY: see the permissions note at the top of this file.
      - name: Post failure log as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Cross-check failure (${{ matrix.target }}) for ${GITHUB_SHA}:"; echo '```'; tail -n 300 ci.log 2>/dev/null; echo '```'; } > /tmp/body.md
          gh issue create --title "ci-log ${GITHUB_SHA::8} ${{ matrix.target }}" --body-file /tmp/body.md || true
