name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # enigo's Linux backend links libxcb; the runner image hasn't got it.
      - name: Install system libraries (enigo/xcb)
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libxcb1-dev libxcb-render0-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libxkbcommon-dev

      - name: Check whole workspace compiles
        run: cargo check --workspace --locked

      - name: Test (protocol, relay, web bridge, host, launcher)
        run: >-
          cargo test --locked
          -p kbdesk-core -p kbdesk-server -p kbdesk-web
          -p kbdesk-host -p kbdesk-launcher

      - name: Release build of the browser-control stack
        run: >-
          cargo build --release --locked
          -p kbdesk-launcher -p kbdesk-server -p kbdesk-web -p kbdesk-host -p kbdesk-client

      # End-to-end smoke test of the exact "control from a browser" path:
      # browser_client.py (WebSocket, like web/index.html) -> kbdesk-web ->
      # kbdesk-server relay -> fake_host.py (speaks the wire protocol).
      # Asserts: spaced ID works, auth, JPEG frames, mouse/key/text input,
      # stream retune, ping/pong latency probe, clean session end.
      - name: E2E smoke test (browser via relay)
        run: |
          set -x
          ./target/release/kbdesk --help | grep -q serve
          test -x ./target/release/kbdesk-server && test -x ./target/release/kbdesk-web
          pip install --quiet websockets
          ./target/release/kbdesk-server --bind 127.0.0.1 --port 21118 &
          ./target/release/kbdesk-web --listen 127.0.0.1:8080 --relay 127.0.0.1:21118 &
          python3 tests/e2e/fake_host.py &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break || sleep 1; done
          curl -sf http://127.0.0.1:8080/config | grep -q '"relay":true'
          curl -sf http://127.0.0.1:8080/ | grep -q 'KB-Desk'
          python3 tests/e2e/browser_client.py
          grep -q 'MouseMove' /tmp/fake_host_log.jsonl
          grep -q 'hello remote' /tmp/fake_host_log.jsonl
          grep -q 'ReleaseAll' /tmp/fake_host_log.jsonl
          grep -q '"quality": 50' /tmp/fake_host_log.jsonl
          echo E2E-OK

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: kbdesk-linux-x86_64
          path: |
            target/release/kbdesk
            target/release/kbdesk-server
            target/release/kbdesk-web
            target/release/kbdesk-host
            target/release/kbdesk-client
          if-no-files-found: error

  cross-check:
    name: cargo check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-gnu, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      # egui/eframe cross-compilation needs target GUI SDKs; the README only
      # claims check-level support, and the headless crates are the ones whose
      # cross-platform code (capture/input backends) actually matters here.
      - run: >-
          cargo check --locked --target ${{ matrix.target }}
          -p kbdesk-core -p kbdesk-server -p kbdesk-web
          -p kbdesk-host -p kbdesk-launcher
