name: Update Cargo.lock (temporary dev helper)

# Triggered by including [update-lock] in a commit message on the PR branch.
# Resolves the workspace (which minimally updates Cargo.lock for newly added
# dependencies) and commits the result back. Removed once the encryption
# work lands.

on:
  push:
    branches: [arena/838961cb-kb-desk]

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, '[update-lock]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve workspace (updates Cargo.lock)
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit Cargo.lock if changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock unchanged"
            exit 0
          fi
          git config user.name "kbdesk-ci"
          git config user.email "ci@kbdesk.local"
          git add Cargo.lock
          git commit -m "chore: update Cargo.lock for new dependencies [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
